# Menjalankan skenario UX di dalam shell sungguhan, di dalam PTY.
#
# Ini satu-satunya lapisan yang memeriksa apa yang TERLIHAT. `go test`
# memeriksa jawaban engine; uji pemasang memeriksa berkas yang mendarat.
# Keduanya tidak akan pernah menangkap baris perintah yang tergambar dua kali,
# karakter pemicu yang tidak pernah tampil, atau kotak yang menuntut ruang
# lebih banyak daripada tinggi layar.
#
# Rangkaian ini dulu hanya pernah jalan di mesin penulisnya, dan hanya untuk
# zsh — tiga rilis berturut-turut memuat bug tampilan yang ditemukan pengguna,
# bukan CI. Kini ia jalan di sini untuk zsh, bash, dan fish.
name: ux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ux:
    name: ux (${{ matrix.shell }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Skenarionya sama untuk ketiganya. Yang berbeda justru bagian yang
        # paling sering rusak: zsh menggambar ulang barisnya sendiri lewat
        # zle, bash menghapus baris sebelum menjalankan `bind -x`, fish tidak
        # menggambar karakter yang disisipkan sampai binding-nya selesai.
        #
        # fish sempat ditahan di luar dengan alasan "penggambaran ulangnya
        # terlalu berbeda": 50 dari 85 lulus. Alasan itu keliru. Empat
        # penyebabnya ada di harness — baris penuh tidak bergulung, ESC[2J
        # dibaca sebagai ESC[0J, CPR selalu dijawab 1;1, dan penanda kesiapan
        # harness sendiri membuka kotak sehingga Enter-nya tertangkap — dan
        # dua sisanya cacat sungguhan di fish yang tidak pernah terlihat
        # justru KARENA angkanya tidak dipercaya. Ketiganya kini 85, 88, 85.
        shell: [zsh, bash, fish]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      # Node dibutuhkan karena skenarionya memakai spec sungguhan — git,
      # docker, kubectl. Menjalankannya tanpa spec hanya menguji kotak kosong.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: pasang shell
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh fish

      - name: bangun
        run: make build

      - name: bangun spec
        run: make specs

      - name: skenario UX
        env:
          SHELL_UJI: ${{ matrix.shell }}
          # Runner CI berbagi inti dengan pekerjaan lain; terlalu banyak sesi
          # sekaligus membuat penantian berbasis keadaan ikut melambat.
          PARALEL: '4'
          # Dan karena itu ia juga harus lebih sabar. Dengan batas bawaan,
          # pemindaian PATH dan pemuatan spec kubectl sempat melewati tiga
          # detik di sini: ketikan berikutnya dikirim ke kotak yang belum
          # selesai digambar, dan rangkaian ini merah delapan kali berturut-
          # turut karena alasan yang tidak ada hubungannya dengan anjuran.
          #
          # Keduanya batas ATAS. Skenario yang memang cepat tidak membayarnya.
          UX_JEDA: '10'
          UX_DIAM: '0.6'
        run: python3 -u tools/uxtest/uxtest.py

      - name: rekam layar saat gagal
        if: failure()
        run: |
          echo "Skenario yang gagal mencetak isi layarnya di keluaran di atas."
          echo "Jalankan satu skenario saja dengan: SKENARIO='<potongan nama>' make ux"
