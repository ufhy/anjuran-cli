name: ci

on:
  push:
  pull_request:

jobs:
  test:
    # Windows ikut di sini bukan sekadar kelengkapan: jalur konsolnya
    # (CONIN$/CONOUT$, ENABLE_VIRTUAL_TERMINAL_PROCESSING) tidak bisa diuji
    # dari mesin pengembangan berbasis Unix, jadi runner inilah satu-satunya
    # tempat kode itu benar-benar dijalankan.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

      # Uji asap memastikan binary-nya benar-benar bisa dijalankan di OS ini,
      # bukan hanya bisa dikompilasi.
      - name: uji asap
        shell: bash
        run: |
          # Windows menolak menjalankan berkas tanpa akhiran .exe, dan
          # `go build -o` tidak menambahkannya sendiri bila namanya ditentukan.
          ext=""
          if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          go build -o "anjuran$ext" ./cmd/anjuran
          "./anjuran$ext" init powershell > /dev/null
          "./anjuran$ext" init bash > /dev/null
          "./anjuran$ext" complete --line "git comm" --specs internal/testdata/specs | grep -q commit
          "./anjuran$ext" widget --line "git stat" --cursor 8 --specs internal/testdata/specs < /dev/null | grep -q '^ok '

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "berkas berikut belum diformat:"
            echo "$unformatted"
            exit 1
          fi

  # Skrip pemasang adalah hal PERTAMA yang dijalankan orang, dan
  # satu-satunya bagian proyek ini yang tidak pernah tersentuh `go test`.
  # Kesalahan di sana tidak terlihat sampai seseorang menempelkan perintah
  # curl dari README dan mendapati shell-nya mengeluh.
  pemasang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: sintaks sh POSIX
        run: |
          sh -n install.sh
          # dash lebih ketat daripada bash dalam mode sh, dan ia yang menjadi
          # /bin/sh di Debian dan Ubuntu.
          dash -n install.sh
      - name: shellcheck
        run: shellcheck -s sh install.sh
      - name: rencana pemasangan bisa disusun tanpa jaringan
        run: |
          keluaran=$(ANJURAN_DRY_RUN=1 ANJURAN_VERSION=v0.0.0 sh install.sh)
          echo "$keluaran"
          echo "$keluaran" | grep -q 'anjuran_0.0.0_linux_' || {
            echo "nama berkas rilis tidak terbentuk benar" >&2; exit 1; }
      - name: sintaks PowerShell
        shell: pwsh
        run: |
          $err = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/install.ps1", [ref]$null, [ref]$err) | Out-Null
          if ($err) {
            $err | ForEach-Object { "$($_.Extent.StartLineNumber): $($_.Message)" }
            exit 1
          }
          'install.ps1 terurai bersih'

  # Kecepatan adalah fitur di sini: anjuran dipanggil setiap kali tombol
  # pemicu ditekan, dan target yang ditetapkan saat arsitekturnya diputuskan
  # adalah di bawah 16 ms per ketikan. `make bench` sudah lama ada, tetapi
  # tidak pernah dijalankan CI — sehingga regresi kecepatan tidak akan
  # ketahuan sampai seseorang merasakannya, dan pada alat seperti ini "terasa
  # lambat" datang jauh sesudah kerusakannya masuk.
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      # Korpusnya WAJIB dibangun di sini.
      #
      # BenchmarkMuatDingin melewati dirinya sendiri bila specs/ tidak ada,
      # dan pemeriksaan ambang di bawah lalu gagal dengan "tidak ditemukan di
      # keluaran". Job ini karena itu merah sejak hari ia ditambahkan — dan
      # yang diukurnya justru muat dingin, satu-satunya angka yang tidak bisa
      # diukur tanpa korpus sungguhan.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: bangun spec
        run: make specs

      - name: benchmark
        run: make bench | tee bench.txt

      - name: periksa ambang
        run: |
          # Ambangnya SANGAT longgar, dan itu disengaja. Runner CI berbagi
          # inti dengan pekerjaan lain, sehingga angka yang ketat hanya akan
          # menghasilkan kegagalan palsu — dan penjaga yang sering salah
          # berhenti dibaca orang. Yang dikejar perubahan besar: jalur panas
          # diukur 3,5 mikrodetik dan muat dingin 1,3 milidetik, jadi
          # ambang di bawah ini memberi puluhan kali lipat ruang.
          gagal=0
          periksa() {
            nama=$1; batas=$2
            ns=$(awk -v n="$nama" '$1 ~ n {print $3; exit}' bench.txt)
            if [ -z "$ns" ]; then
              echo "::error::benchmark $nama tidak ditemukan di keluaran"
              gagal=1
              return
            fi
            ns=${ns%.*}
            echo "$nama: ${ns} ns/op (batas ${batas})"
            if [ "$ns" -gt "$batas" ]; then
              echo "::error::$nama = ${ns} ns/op, melewati batas ${batas}"
              gagal=1
            fi
          }
          periksa '^BenchmarkComplete' 200000
          periksa '^BenchmarkMuatDingin' 20000000
          exit $gagal

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench
          path: bench.txt

  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: cross-compile
        run: make cross

  specs:
    # Transpiler diuji terpisah karena butuh node dan jaringan; kegagalannya
    # tidak boleh menutupi hasil uji Go.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: bangun spec
        run: make specs
      - name: uji terhadap spec asli
        run: go test ./internal/engine/ -run 'TestSpecAsli|TestLoadSpec' -v
